name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: habitica-main
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=,format=long
            type=sha,prefix=,format=short

      - name: Build and push server image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: server
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GITHUB_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    # Self-hosted runner with LAN/Tailscale SSH path (jump → app host).
    # Ephemeral github-hosted Tailscale nodes are ACL-blocked from SSH to homelab hosts.
    runs-on: [self-hosted, habitica-deploy]
    if: vars.HABITICA_DEPLOY_ENABLED == 'true'
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_JUMP: ${{ secrets.DEPLOY_JUMP }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$DEPLOY_JUMP" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "root@${DEPLOY_JUMP}" "ssh-keyscan -H ${DEPLOY_HOST} 2>/dev/null" >> ~/.ssh/known_hosts || true

          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ProxyJump="root@${DEPLOY_JUMP}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'set -euo pipefail
             cd /opt/stacks/habitica
             sudo docker compose pull
             sudo docker compose up -d --force-recreate server
             healthy=0
             for i in $(seq 1 30); do
               code=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:3070/api/v3/status || true)
               if [ "$code" = "200" ] || [ "$code" = "302" ]; then
                 echo "habitica status ok (http $code)"
                 healthy=1
                 break
               fi
               sleep 2
             done
             if [ "$healthy" != "1" ]; then
               echo "habitica status check timed out" >&2
               sudo docker compose ps
               exit 1
             fi
             echo "Pruning unused ghcr.io/nowjon/habitica images..."
             # image prune does not support a reference filter; remove unused
             # repo images by ID, then clear dangling layers.
             sudo docker images ghcr.io/nowjon/habitica --format "{{.ID}}" | sort -u | while read -r id; do
               if [ -z "$(sudo docker ps -aq --filter "ancestor=${id}")" ]; then
                 sudo docker rmi -f "${id}" || true
               fi
             done
             sudo docker image prune -f
             echo "habitica image prune complete"'
