name: Rebase Upstream
on:
  schedule:
    - cron: "38 1 * * *" # run every night
  workflow_dispatch: # allow manual running

# The repo's default token is read-only. This workflow force-pushes the
# rebased default branch, then starts Build and Deploy. A GITHUB_TOKEN push
# does not trigger push workflows, so the deploy is dispatched explicitly.
permissions:
  contents: write
  actions: write

jobs:
  Rebase:
    runs-on: ubuntu-latest
    outputs:
      rebased: ${{ steps.rebase.outputs.rebased }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1000 # greater than the number of commits made in the fork

      - name: Rebase on Upstream Release Branch
        id: rebase
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -ex

          UPSTREAM="HabitRPG/habitica"
          if [ -z "$UPSTREAM" ]; then
              echo "$GH_TOKEN" | gh auth login --with-token
              UPSTREAM=$(gh api repos/:owner/:repo --jq .parent.full_name)
              if [ -z "$UPSTREAM" ]; then echo "Can't find upstream" >&2 && exit 1; fi
          fi
          if [ ! $(echo "$UPSTREAM" | egrep '^(http|git@)') ]; then
              UPSTREAM=https://github.com/$UPSTREAM.git
          fi

          git remote add upstream "$UPSTREAM"

          git fetch upstream release

          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "GitHub Actions"

          git rebase upstream/release

          # Upstream release edits .github/workflows. The Actions token cannot
          # push those files, and this fork keeps its own workflows.
          if ! git diff --quiet origin/main -- .github/workflows; then
              git checkout origin/main -- .github/workflows
              git commit -m "chore(ci): keep homelab workflows across upstream rebase"
          fi

          if [ "$(git status | grep diverged)" ]; then
              git push origin "$(git branch --show-current)" --force-with-lease
              echo "rebased=true" >> "$GITHUB_OUTPUT"
              gh workflow run build-and-deploy.yml --ref main
          else
            echo "rebased=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash
